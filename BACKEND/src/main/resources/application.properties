# Application
spring.application.name=BACKEND
spring.config.import=optional:configtree:/run/secrets/

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/van_card_news_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:van_web}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${db_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Database Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Logging & Error
logging.level.root=${LOG_LEVEL_ROOT:INFO}
spring.web.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}
spring.web.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:on_param}
spring.web.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}

# App Upload Storage
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}
app.upload.public-base-url=${APP_UPLOAD_PUBLIC_BASE_URL:http://localhost:8080/uploads}

# CORS Allowed Origins (기본값 설정)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
