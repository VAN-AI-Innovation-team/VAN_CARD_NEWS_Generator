spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application
spring.application.name=BACKEND
spring.config.import=optional:configtree:/run/secrets/

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# Database Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Logging & Error
logging.level.root=${LOG_LEVEL_ROOT:INFO}
spring.web.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}
spring.web.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:on_param}
spring.web.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}

# App Upload Storage
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}
app.upload.public-base-url=${APP_UPLOAD_PUBLIC_BASE_URL:https://van-card-news-backend-571061095487.asia-northeast3.run.app/uploads}

# Generated Card Image Storage
app.generated.dir=${APP_GENERATED_DIR:/app/generated}
app.generated.public-base-url=${APP_GENERATED_PUBLIC_BASE_URL:https://van-card-news-backend-571061095487.asia-northeast3.run.app/generated}

# GCS Storage (prod 프로필에서 사용, 인증은 Cloud Run 서비스 계정 ADC)
app.gcs.bucket=${GCS_BUCKET:}
app.gcs.upload-prefix=${GCS_UPLOAD_PREFIX:uploads}
app.gcs.generated-prefix=${GCS_GENERATED_PREFIX:generated}

# Internal Scheduler Trigger (Cloud Scheduler -> /internal/**, 공유 시크릿 헤더)
# 값이 비어 있으면 /internal/** 은 전면 거부된다
app.internal.scheduler-secret=${INTERNAL_SCHEDULER_SECRET:}

# Instagram Access Token (DB 암호화 저장)
# configtree는 부팅 시 1회 로드라 런타임에 갱신한 토큰을 다시 읽지 못한다. 그래서 토큰은 DB에 두고
# 바뀔 일이 없는 암호화 키만 여기로 주입한다. 키는 base64로 인코딩된 32바이트(AES-256).
# 아래 기본값은 dev 목업 전용이며 리포에 노출된 값이다. prod에서 이 값이면 기동에 실패한다.
app.instagram.token.encryption-key=${INSTAGRAM_TOKEN_ENCRYPTION_KEY:ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=}
app.instagram.graph-base-url=${INSTAGRAM_GRAPH_BASE_URL:https://graph.instagram.com}

# Instagram Carousel Publish (컨테이너 상태 폴링)
# Meta 권장치는 분당 1회·최대 5분이다. Higgsfield의 2000ms/150회를 복사하면 과호출이 된다.
app.publish.instagram.poll-interval-ms=${INSTAGRAM_POLL_INTERVAL_MS:60000}
app.publish.instagram.max-poll-count=${INSTAGRAM_MAX_POLL_COUNT:5}

# Instagram Schedule (예약 등록 검증)
# 리드타임 하한은 워커 주기보다 넉넉해야 한다. 주기보다 짧으면 등록되자마자 유예 판정을 받는다.
app.publish.schedule.min-lead-minutes=${PUBLISH_MIN_LEAD_MINUTES:5}
app.publish.schedule.max-horizon-days=${PUBLISH_MAX_HORIZON_DAYS:30}

# Instagram Publish Worker (/internal/scheduler/publish-due)
# batch-size: 한 건이 최대 5분(폴링 상한)을 쓰므로 Cloud Run 요청 타임아웃 안에 끝날 만큼만 집는다
# stuck-threshold: 폴링 상한(5분)의 2배. 정상 처리 중인 건을 회수하지 않을 만큼 여유를 둔다
# grace: 다운타임 뒤 워커가 다시 돌 때 하루 지난 예약까지 몰아서 올리는 사고를 막는 유예 상한
app.publish.worker.batch-size=${PUBLISH_WORKER_BATCH_SIZE:5}
app.publish.worker.stuck-threshold-minutes=${PUBLISH_WORKER_STUCK_THRESHOLD_MINUTES:10}
app.publish.worker.grace-minutes=${PUBLISH_WORKER_GRACE_MINUTES:60}

# 인프로세스 워커 트리거 — 보조 그물이다.
# 사용자가 기다리는 발행은 POST .../publish/instagram/run이 요청 안에서 끝낸다. Cloud Run은
# 요청 처리 중에만 CPU를 주므로 요청 밖에서 도는 이 주기는 배포 환경에서 신뢰할 수 없다.
# 값을 하는 곳은 CPU 제약이 없는 로컬 개발과, 인스턴스가 깨어 있을 때의 재시도 회수다.
# 예약 발행의 정시 실행은 Cloud Scheduler 잡(VAN-24)이 담당해야 한다.
app.publish.worker.in-process.enabled=${PUBLISH_WORKER_IN_PROCESS_ENABLED:true}
app.publish.worker.in-process.interval-ms=${PUBLISH_WORKER_IN_PROCESS_INTERVAL_MS:5000}

# Instagram Publish Retry (원인별 자동 재시도)
# 재시도 지연은 원인마다 다르므로 PublishFailure enum이 들고 있고, 여기서는 횟수 상한만 정한다.
# 상한을 넘긴 건은 FAILED로 남고 사용자가 다시 요청한다.
app.publish.retry.max-count=${PUBLISH_RETRY_MAX_COUNT:3}

# CORS Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://van-card-news-generator.vercel.app}

# AI Mock 분기 (프로필과 별개 축)
# 프로필 하나로 OpenAI·Higgsfield·인스타가 함께 뒤집히면 "인스타만 실제로" 같은 부분 전환이 불가능하다.
# AI 두 쌍만 이 값으로 가르고, 기본값은 프로필별로 둬서 프로필만 뒤집었을 때 동작은 종전과 같다.
app.ai.mock=${AI_MOCK:true}

# OpenAI
app.ai.openai.model=${OPENAI_MODEL:gpt-5.2}
app.ai.openai.max-tokens=${OPENAI_MAX_TOKENS:2048}

# Higgsfield
app.ai.higgsfield.api-key-id=${HIGGSFIELD_API_KEY_ID:}
app.ai.higgsfield.api-key-secret=${HIGGSFIELD_API_KEY_SECRET:}
app.ai.higgsfield.base-url=${HIGGSFIELD_BASE_URL:https://platform.higgsfield.ai}
app.ai.higgsfield.model=${HIGGSFIELD_MODEL:higgsfield-ai/soul/standard}
app.ai.higgsfield.poll-interval-ms=${HIGGSFIELD_POLL_INTERVAL_MS:2000}
app.ai.higgsfield.max-poll-count=${HIGGSFIELD_MAX_POLL_COUNT:150}

# Multipart (File Upload Size)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
