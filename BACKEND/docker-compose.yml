services:
  # PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: van-card-news-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: van_card_news_db
      POSTGRES_USER: van_web
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data # DB 데이터 보존
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U van_web -d van_card_news_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: van-card-news-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      SPRING_CONFIG_IMPORT: "optional:configtree:/run/secrets/"
      LOG_LEVEL_ROOT: INFO
      SERVER_ERROR_INCLUDE_MESSAGE: always
      SERVER_ERROR_INCLUDE_STACKTRACE: on_param
      SERVER_ERROR_INCLUDE_BINDING_ERRORS: always
      APP_UPLOAD_DIR: /app/uploads
      APP_UPLOAD_PUBLIC_BASE_URL: http://localhost:8080/uploads
      APP_GENERATED_DIR: /app/generated
      APP_GENERATED_PUBLIC_BASE_URL: http://localhost:8080/generated

    volumes:
      - uploads_data:/app/uploads
      - generated_data:/app/generated
    ports:
      - "8080:8080"
    networks:
      - backend_network
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    env_file:
      - .env

volumes:
  postgres_data:
  uploads_data:
  generated_data:

networks:
  backend_network:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt
