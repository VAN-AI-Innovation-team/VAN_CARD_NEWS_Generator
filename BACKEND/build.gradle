plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.van'
version = '0.0.1-SNAPSHOT'
description = 'BACKEND'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // OpenAI Java SDK
    implementation 'com.openai:openai-java:4.54.0'

    // Google Cloud Storage (prod 이미지 스토리지)
    implementation 'com.google.cloud:google-cloud-storage:2.43.2'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()

    // OpenAI SDK는 OpenAIOkHttpClient.fromEnv()로 환경변수를 직접 읽으므로 스프링
    // 프로퍼티로 주입할 수 없다. prod 프로필 빈 생성 테스트에 필요한 더미 값이며,
    // 키 존재만 확인하고 네트워크는 타지 않는다. 실 키는 절대 쓰지 않는다.
    environment 'OPENAI_API_KEY', 'test-dummy-key'
}

jar {
    enabled = false
}
