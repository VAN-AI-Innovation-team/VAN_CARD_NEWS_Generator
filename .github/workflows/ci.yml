  name: CI

  on:
    push:
      branches:
        - main
        - develop
    pull_request:
      branches:
        - main
        - develop

  jobs:
    backend-test:
      name: Backend Test
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:17-alpine
          env:
            POSTGRES_DB: van_card_news_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
          ports:
            - 5432:5432
          options: >-
            --health-cmd="pg_isready -U postgres -d van_card_news_db"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5

      defaults:
        run:
          working-directory: BACKEND

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'

        - name: Grant execute permission
          run: chmod +x gradlew

        - name: Run backend tests
          run: ./gradlew clean test

    frontend-build:
      name: Frontend Production Build
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: FRONTEND

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: npm
            cache-dependency-path: FRONTEND/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Production build
          run: npm run build
